<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
    <title>To Do List</title>

</head>

<body>

    <div class="todo-container">

        <h1>قائمة المهام 📝</h1>

        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="اكتب مهمة جديدة..."
            >

            <button id="addBtn">إضافة</button>
        </div>

        <p id="emptyMessage">لا توجد مهام حالياً 🎉</p>

        <ul id="taskList"></ul>

        <div class="task-info">
            عدد المهام:
            <span id="taskCount">0</span>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
